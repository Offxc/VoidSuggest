# Not a multi-package workspace. This file only carries pnpm settings.
# Dependencies with install scripts are listed explicitly; everything else is
# blocked from running scripts at install time.
allowBuilds:
  "@embedded-postgres/linux-x64": true
  "@prisma/engines": true
  esbuild: true
  prisma: true

onlyBuiltDependencies:
  - embedded-postgres
  - "@embedded-postgres/linux-x64"
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild

# Prisma's config loader pins an `effect` release with a published ReDoS
# advisory (fixed in 3.22.1). It only runs in Prisma's command-line tools, but
# take the patched release anyway so the dependency audit stays clean.
overrides:
  effect: ">=3.22.1 <4"
