services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: voidsuggest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: voidsuggest
    volumes:
      # Postgres 18 images keep their version-specific data directory under this path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voidsuggest"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No `ports:` on purpose. Only the web container can reach the database.

  # Applies pending database migrations, then exits. Runs before `web` starts.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://voidsuggest:${POSTGRES_PASSWORD}@db:5432/voidsuggest
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://voidsuggest:${POSTGRES_PASSWORD}@db:5432/voidsuggest
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Loopback only. Put a reverse proxy that handles HTTPS in front of this;
    # the site is not meant to be reachable from the internet directly.
    ports:
      - "127.0.0.1:${WEB_PORT:-3400}:3000"

volumes:
  pgdata:
